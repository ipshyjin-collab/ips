<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Group Photo Directory</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f3f5f7;color:#172033;font-family:Arial,Helvetica,sans-serif}
header{background:#fff;border-bottom:1px solid #dfe3e8;padding:12px 18px;display:flex;justify-content:space-between;align-items:center;gap:12px;position:sticky;top:0;z-index:50}
h1{font-size:20px;margin:0 0 3px}.status{font-size:12px;color:#667085}
.controls{display:flex;gap:7px;flex-wrap:wrap}
.btn{border:1px solid #cbd5e1;background:#fff;border-radius:7px;padding:8px 12px;cursor:pointer}
.btn.primary{background:#2563eb;color:#fff;border-color:#2563eb}.btn.danger{color:#b42318}
main{max-width:1500px;margin:18px auto;padding:0 12px}
.photo-card{background:#fff;border:1px solid #dfe3e8;border-radius:12px;padding:9px;box-shadow:0 3px 12px rgba(0,0,0,.06)}
.photo-wrap{position:relative;width:100%;line-height:0}
.photo{display:block;width:100%;height:auto;border-radius:6px}
.hotspot{position:absolute;border:2px solid transparent;background:transparent;border-radius:8px;padding:0;cursor:pointer;z-index:5}
.hotspot:hover,.hotspot:focus,.hotspot.active{border-color:#fff;box-shadow:0 0 0 2px #2563eb;background:rgba(37,99,235,.10);outline:none}
.popup{display:none;position:absolute;z-index:30;width:245px;background:#fff;color:#172033;border:1px solid #d7dce3;border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.22);text-align:left;line-height:1.35;overflow:hidden}
.hotspot:hover .popup,.hotspot:focus .popup,.hotspot.active .popup{display:block}
.popup.auto{left:50%;top:calc(100% + 9px);transform:translateX(-50%)}
.popup.right{left:calc(100% + 9px);top:0}
.popup.left{right:calc(100% + 9px);top:0}
.popup.above{left:50%;bottom:calc(100% + 9px);transform:translateX(-50%)}
.popup.below{left:50%;top:calc(100% + 9px);transform:translateX(-50%)}
.popup .title{background:#2563eb;color:#fff;padding:9px 11px;font-weight:700}
.popup .body{padding:10px 11px;font-size:13px}.row{margin:5px 0}.label{font-weight:700;color:#344054}
.popup .edit{margin-top:8px;width:100%;padding:7px;border:1px solid #cbd5e1;border-radius:6px;background:#f8fafc;cursor:pointer}
.edit-mode .hotspot{border:2px dashed rgba(37,99,235,.8);background:rgba(37,99,235,.08);cursor:move}
.edit-mode .hotspot::after{content:attr(data-label);position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:11px;line-height:1;background:#2563eb;color:#fff;padding:3px 5px;border-radius:4px;white-space:nowrap}
.edit-mode .popup{display:none!important}
.editorbar{display:none;background:#eef4ff;border:1px solid #cfe0ff;padding:9px 11px;border-radius:8px;margin-bottom:9px;font-size:13px}
.editorbar.show{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.legend{font-size:12px;color:#667085;margin-top:9px}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.48);z-index:100;align-items:center;justify-content:center;padding:14px}
.modal.open{display:flex}.modal-box{width:min(560px,100%);background:#fff;border-radius:12px;padding:18px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal-box h2{margin:0 0 14px;font-size:19px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.field{display:flex;flex-direction:column;gap:4px}.full{grid-column:1/-1}label{font-size:12px;font-weight:700;color:#475467}
input,select{width:100%;padding:9px;border:1px solid #cbd5e1;border-radius:7px;font-size:14px;background:#fff}
.modal-actions{display:flex;justify-content:space-between;gap:8px;margin-top:16px}.right-actions{display:flex;gap:8px}
.small{font-size:11px;color:#667085}
@media(max-width:700px){header{align-items:flex-start;flex-direction:column}.grid{grid-template-columns:1fr}.full{grid-column:auto}.popup{width:210px}}
</style>
</head>
<body>
<header>
 <div><h1>Group Photo Directory</h1><div class="status" id="status">Hover or tap a person to view details.</div></div>
 <div class="controls">
  <button class="btn primary" id="editModeBtn">Edit / Add People</button>
  <button class="btn" id="resetBtn">Reset</button>
 </div>
</header>
<main>
 <div id="editorBar" class="editorbar">
  <span><b>Edit mode:</b> drag a box onto a person's face. Click a box to edit that person's details.</span>
  <button class="btn primary" id="addBtn">+ Add Person</button>
 </div>
 <div class="photo-card">
  <div class="photo-wrap" id="photoWrap"><img class="photo" src="image1.jpg" alt="Group photograph"></div>
  <div class="legend">Normal mode: names are hidden. Hover on desktop or tap on mobile to show the popup.</div>
 </div>
</main>

<div class="modal" id="modal">
 <div class="modal-box">
  <h2 id="modalTitle">Edit Person</h2>
  <form id="personForm">
   <div class="grid">
    <div class="field full"><label>Name</label><input id="fName" required></div>
    <div class="field full"><label>Address</label><input id="fAddress"></div>
    <div class="field"><label>Phone</label><input id="fPhone"></div>
    <div class="field"><label>Email</label><input id="fEmail" type="email"></div>
    <div class="field full"><label>Other details</label><input id="fOccupation"></div>
    <div class="field full"><label>Popup position</label>
      <select id="fPopup"><option value="auto">Auto / below</option><option value="right">Right</option><option value="left">Left</option><option value="above">Above</option><option value="below">Below</option></select>
      <div class="small">You can change this separately for each person.</div>
    </div>
   </div>
   <div class="modal-actions">
    <button type="button" class="btn danger" id="deleteBtn">Delete person</button>
    <div class="right-actions"><button type="button" class="btn" id="cancelBtn">Cancel</button><button type="submit" class="btn primary">Save</button></div>
   </div>
  </form>
 </div>
</div>

<script>
const DEFAULT_DATA = [{"id": 1, "name": "STUDENT1", "address": "", "phone": "", "email": "", "occupation": "", "left": 15.8, "top": 7.0, "width": 7.0, "height": 22.0, "popup": "auto"}, {"id": 2, "name": "STUDENT2", "address": "", "phone": "", "email": "", "occupation": "", "left": 20.0, "top": 8.0, "width": 6.0, "height": 19.0, "popup": "auto"}, {"id": 3, "name": "STUDENT3", "address": "", "phone": "", "email": "", "occupation": "", "left": 24.0, "top": 10.0, "width": 6.0, "height": 18.0, "popup": "auto"}, {"id": 4, "name": "STUDENT4", "address": "", "phone": "", "email": "", "occupation": "", "left": 28.0, "top": 11.0, "width": 6.0, "height": 18.0, "popup": "auto"}, {"id": 5, "name": "STUDENT5", "address": "", "phone": "", "email": "", "occupation": "", "left": 32.0, "top": 11.0, "width": 6.0, "height": 18.0, "popup": "auto"}, {"id": 6, "name": "STUDENT6", "address": "", "phone": "", "email": "", "occupation": "", "left": 37.0, "top": 11.0, "width": 6.0, "height": 18.0, "popup": "auto"}, {"id": 7, "name": "STUDENT7", "address": "", "phone": "", "email": "", "occupation": "", "left": 42.0, "top": 10.0, "width": 6.0, "height": 18.0, "popup": "auto"}, {"id": 8, "name": "STUDENT8", "address": "", "phone": "", "email": "", "occupation": "", "left": 47.0, "top": 10.0, "width": 6.0, "height": 18.0, "popup": "auto"}, {"id": 9, "name": "STUDENT9", "address": "", "phone": "", "email": "", "occupation": "", "left": 51.0, "top": 9.0, "width": 6.0, "height": 19.0, "popup": "auto"}, {"id": 10, "name": "STUDENT10", "address": "", "phone": "", "email": "", "occupation": "", "left": 56.0, "top": 9.0, "width": 6.0, "height": 19.0, "popup": "auto"}, {"id": 11, "name": "STUDENT11", "address": "", "phone": "", "email": "", "occupation": "", "left": 61.0, "top": 10.0, "width": 6.0, "height": 19.0, "popup": "auto"}, {"id": 12, "name": "STUDENT12", "address": "", "phone": "", "email": "", "occupation": "", "left": 66.0, "top": 10.0, "width": 6.0, "height": 19.0, "popup": "auto"}, {"id": 13, "name": "STUDENT13", "address": "", "phone": "", "email": "", "occupation": "", "left": 71.0, "top": 9.0, "width": 6.0, "height": 19.0, "popup": "auto"}, {"id": 14, "name": "STUDENT14", "address": "", "phone": "", "email": "", "occupation": "", "left": 76.0, "top": 10.0, "width": 6.0, "height": 19.0, "popup": "auto"}, {"id": 15, "name": "STUDENT15", "address": "", "phone": "", "email": "", "occupation": "", "left": 81.0, "top": 11.0, "width": 6.0, "height": 19.0, "popup": "auto"}, {"id": 16, "name": "STUDENT16", "address": "", "phone": "", "email": "", "occupation": "", "left": 86.0, "top": 12.0, "width": 6.0, "height": 19.0, "popup": "auto"}, {"id": 17, "name": "STUDENT17", "address": "", "phone": "", "email": "", "occupation": "", "left": 20.0, "top": 27.0, "width": 8.0, "height": 22.0, "popup": "auto"}, {"id": 18, "name": "STUDENT18", "address": "", "phone": "", "email": "", "occupation": "", "left": 29.0, "top": 36.0, "width": 7.0, "height": 19.0, "popup": "auto"}, {"id": 19, "name": "STUDENT19", "address": "", "phone": "", "email": "", "occupation": "", "left": 38.0, "top": 38.0, "width": 7.0, "height": 19.0, "popup": "auto"}, {"id": 20, "name": "STUDENT20", "address": "", "phone": "", "email": "", "occupation": "", "left": 47.0, "top": 39.0, "width": 7.0, "height": 19.0, "popup": "auto"}, {"id": 21, "name": "STUDENT21", "address": "", "phone": "", "email": "", "occupation": "", "left": 56.0, "top": 40.0, "width": 7.0, "height": 19.0, "popup": "auto"}, {"id": 22, "name": "STUDENT22", "address": "", "phone": "", "email": "", "occupation": "", "left": 65.0, "top": 40.0, "width": 7.0, "height": 19.0, "popup": "auto"}, {"id": 23, "name": "STUDENT23", "address": "", "phone": "", "email": "", "occupation": "", "left": 74.0, "top": 40.0, "width": 7.0, "height": 19.0, "popup": "auto"}, {"id": 24, "name": "STUDENT24", "address": "", "phone": "", "email": "", "occupation": "", "left": 83.0, "top": 39.0, "width": 7.0, "height": 19.0, "popup": "auto"}, {"id": 25, "name": "STUDENT25", "address": "", "phone": "", "email": "", "occupation": "", "left": 19.0, "top": 62.0, "width": 8.0, "height": 23.0, "popup": "auto"}, {"id": 26, "name": "STUDENT26", "address": "", "phone": "", "email": "", "occupation": "", "left": 31.0, "top": 65.0, "width": 8.0, "height": 22.0, "popup": "auto"}, {"id": 27, "name": "STUDENT27", "address": "", "phone": "", "email": "", "occupation": "", "left": 42.0, "top": 67.0, "width": 8.0, "height": 21.0, "popup": "auto"}, {"id": 28, "name": "STUDENT28", "address": "", "phone": "", "email": "", "occupation": "", "left": 53.0, "top": 67.0, "width": 8.0, "height": 21.0, "popup": "auto"}, {"id": 29, "name": "STUDENT29", "address": "", "phone": "", "email": "", "occupation": "", "left": 64.0, "top": 65.0, "width": 8.0, "height": 22.0, "popup": "auto"}, {"id": 30, "name": "STUDENT30", "address": "", "phone": "", "email": "", "occupation": "", "left": 75.0, "top": 64.0, "width": 8.0, "height": 23.0, "popup": "auto"}, {"id": 31, "name": "STUDENT31", "address": "", "phone": "", "email": "", "occupation": "", "left": 86.0, "top": 63.0, "width": 7.0, "height": 24.0, "popup": "auto"}];
let people = JSON.parse(localStorage.getItem('groupPhotoPeopleV2') || 'null') || DEFAULT_DATA;
let editMode=false, editingId=null, drag=null;
const wrap=document.getElementById('photoWrap'), modal=document.getElementById('modal');

function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function save(){localStorage.setItem('groupPhotoPeopleV2',JSON.stringify(people));}
function openEditor(id){
 editingId=id; const p=people.find(x=>x.id===id); if(!p)return;
 document.getElementById('modalTitle').textContent='Edit '+p.name;
 document.getElementById('fName').value=p.name||'';
 document.getElementById('fAddress').value=p.address||'';
 document.getElementById('fPhone').value=p.phone||'';
 document.getElementById('fEmail').value=p.email||'';
 document.getElementById('fOccupation').value=p.occupation||'';
 document.getElementById('fPopup').value=p.popup||'auto';
 modal.classList.add('open'); document.getElementById('fName').focus();
}
function popupClass(p){return ['auto','right','left','above','below'].includes(p.popup)?p.popup:'auto';}
function render(){
 wrap.querySelectorAll('.hotspot').forEach(e=>e.remove());
 people.forEach(p=>{
  const b=document.createElement('button'); b.type='button'; b.className='hotspot'; b.dataset.id=p.id; b.dataset.label=p.name;
  b.style.left=p.left+'%'; b.style.top=p.top+'%'; b.style.width=p.width+'%'; b.style.height=p.height+'%';
  b.setAttribute('aria-label',p.name);
  const pop=document.createElement('div'); pop.className='popup '+popupClass(p);
  pop.innerHTML=`<div class="title">${esc(p.name)}</div><div class="body">
   ${p.address?`<div class="row"><span class="label">Address:</span> ${esc(p.address)}</div>`:''}
   ${p.phone?`<div class="row"><span class="label">Phone:</span> ${esc(p.phone)}</div>`:''}
   ${p.email?`<div class="row"><span class="label">Email:</span> ${esc(p.email)}</div>`:''}
   ${p.occupation?`<div class="row"><span class="label">Other:</span> ${esc(p.occupation)}</div>`:''}
   <button type="button" class="edit">Edit details</button></div>`;
  b.appendChild(pop);
  b.addEventListener('click',e=>{
   if(editMode){e.stopPropagation();openEditor(p.id);}
   else {document.querySelectorAll('.hotspot.active').forEach(x=>x.classList.remove('active'));b.classList.add('active');}
  });
  pop.querySelector('.edit').addEventListener('click',e=>{e.stopPropagation();openEditor(p.id);});
  b.addEventListener('pointerdown',e=>{
   if(!editMode || e.button===2)return;
   e.preventDefault(); b.setPointerCapture(e.pointerId);
   const r=wrap.getBoundingClientRect();
   drag={id:p.id,startX:e.clientX,startY:e.clientY,origL:p.left,origT:p.top,r};
  });
  b.addEventListener('pointermove',e=>{
   if(!drag || drag.id!==p.id)return;
   const dx=(e.clientX-drag.startX)/drag.r.width*100, dy=(e.clientY-drag.startY)/drag.r.height*100;
   p.left=Math.max(0,Math.min(100-p.width,drag.origL+dx)); p.top=Math.max(0,Math.min(100-p.height,drag.origT+dy));
   b.style.left=p.left+'%'; b.style.top=p.top+'%';
  });
  b.addEventListener('pointerup',()=>{if(drag&&drag.id===p.id){save();drag=null;}});
  wrap.appendChild(b);
 });
 wrap.parentElement.classList.toggle('edit-mode',editMode);
}
document.getElementById('editModeBtn').onclick=()=>{
 editMode=!editMode;
 document.getElementById('editorBar').classList.toggle('show',editMode);
 document.getElementById('editModeBtn').textContent=editMode?'Done Editing':'Edit / Add People';
 document.getElementById('status').textContent=editMode?'Drag boxes to position them, then click a box to edit it.':'Hover or tap a person to view details.';
 render();
};
document.getElementById('addBtn').onclick=()=>{
 const id=people.length?Math.max(...people.map(p=>p.id))+1:1;
 const p={id,name:'STUDENT'+id,address:'',phone:'',email:'',occupation:'',left:45,top:45,width:7,height:12,popup:'auto'};
 people.push(p); save(); render(); openEditor(id);
};
document.getElementById('personForm').addEventListener('submit',e=>{
 e.preventDefault(); const p=people.find(x=>x.id===editingId); if(!p)return;
 p.name=document.getElementById('fName').value.trim()||('STUDENT'+p.id);
 p.address=document.getElementById('fAddress').value.trim();
 p.phone=document.getElementById('fPhone').value.trim();
 p.email=document.getElementById('fEmail').value.trim();
 p.occupation=document.getElementById('fOccupation').value.trim();
 p.popup=document.getElementById('fPopup').value;
 save(); modal.classList.remove('open'); render();
});
document.getElementById('deleteBtn').onclick=()=>{
 if(editingId==null)return;
 if(confirm('Delete this person hotspot?')){people=people.filter(p=>p.id!==editingId);save();modal.classList.remove('open');render();}
};
document.getElementById('cancelBtn').onclick=()=>modal.classList.remove('open');
modal.addEventListener('click',e=>{if(e.target===modal)modal.classList.remove('open');});
document.getElementById('resetBtn').onclick=()=>{
 if(confirm('Reset all people to the original sample data?')){localStorage.removeItem('groupPhotoPeopleV2');people=JSON.parse(JSON.stringify(DEFAULT_DATA));render();}
};
render();
</script>
</body>
</html>
